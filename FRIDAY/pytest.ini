[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
norecursedirs = scratch
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:'audioop' is deprecated and slated for removal in Python 3\.13:DeprecationWarning:pipecat\.audio\.utils
    ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning
    ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning:pytest_asyncio\.plugin
